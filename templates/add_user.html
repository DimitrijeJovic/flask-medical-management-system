{% extends "base.html" %}
{% block content %}

<div class="page-heading">
    <div>
        <p class="dashboard-kicker mb-1">Administracija</p>
        <h2>Dodavanje novog korisnika</h2>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card p-4 shadow-sm border-0">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Ime i prezime</label>
                    <input class="form-control" name="ime" placeholder="Ime i prezime" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email adresa</label>
                    <input class="form-control" name="email" type="email" placeholder="ime@domzdravlja.rs" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lozinka (min. 8 karaktera)</label>
                    <input class="form-control" type="password" name="password" minlength="8" placeholder="Unesite privremenu lozinku" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Uloga u sistemu</label>
                    <select class="form-select" name="role" required>
                        <option value="">Izaberite ulogu</option>
                        <option value="sestra">Medicinska sestra</option>
                        <option value="doktor">Doktor</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Odeljenje (opciono)</label>
                    <select class="form-select" name="department_id">
                        <option value="">Nema dodeljenog odeljenja</option>
                        {% for d in departments %}
                        <option value="{{ d.id }}">{{ d.naziv }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/users" class="btn btn-outline-secondary">Odustani</a>
                    <button type="submit" class="btn btn-primary px-4">Kreiraj nalog</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
