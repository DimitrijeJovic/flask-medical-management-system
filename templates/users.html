{% extends "base.html" %}
{% block content %}

<div class="page-heading">
    <div>
        <p class="dashboard-kicker mb-1">Administracija</p>
        <h2>Korisnici</h2>
    </div>
</div>

<div class="data-panel">
    <div class="data-panel-toolbar">
        <span class="toolbar-note">Upravljanje nalozima zaposlenih</span>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ime</th>
                    <th>Email</th>
                    <th>Rola</th>
                    <th>Akcija</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.id }}</td>
                    <td>{{ u.ime }}</td>
                    <td>{{ u.email }}</td>
                    <td>
                        <span class="badge bg-{% if u.role=='admin' %}danger{% elif u.role=='doktor' %}primary{% else %}success{% endif %}">
                        {{ u.role }}
                        </span>
                    </td>
                    <td>
                        <a href="/users/delete/{{u.id}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Obrisati korisnika?')">
                           Obrisi
                        </a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center py-5">Nema korisnika za prikaz.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
